name: Testy Live Signal (PAPER)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Public Yahoo ES futures research every ~15 min on weekdays, UTC.
    - cron: "7,22,37,52 * * 1-5"
  workflow_dispatch:
jobs:
  pytest:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests without any API secrets
        run: python -m pytest -q
      - name: Smoke-test Streamlit launch offline
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("app.py", default_timeout=40).run()
          if len(app.exception):
              raise RuntimeError(str(app.exception))
          print("Claude V3 dashboard started successfully")
          PY

  public_futures_paper:
    name: ES=F GitHub PAPER (bez sekretow)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    concurrency:
      group: claude-auto-public-futures
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public-feed dependencies
        run: python -m pip install "pandas>=2.2,<3" "yfinance>=0.2.50,<2" "requests>=2.31,<3"
      - name: Collect and settle public ES futures PAPER
        run: python github_paper_worker.py
      - name: Save PAPER journal in GitHub repository
        run: |
          git config user.name "CLAUDE PAPER research bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auto_futures/
          if ! git diff --cached --quiet; then
            git commit -m "paper: public ES futures journal [skip ci]"
            git push origin HEAD:main
          else
            echo "Nothing to persist"
          fi
