name: CLAUDE PROGRAM 2 - Auto PAPER Futures (public)
"on":
  push:
    branches:
      - feature-github-24h-public-futures-paper-20261014
  schedule:
    # UTC. Offset from the top of the hour reduces queue delays.
    # Every 15 min during weekdays, irrespective of Streamlit uptime.
    - cron: "7,22,37,52 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-auto-public-futures
  cancel-in-progress: false

jobs:
  paper:
    if: github.ref == 'refs/heads/main'
    name: ES futures - Yahoo PAPER only
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install open-data dependencies
        run: python -m pip install "pandas>=2.2,<3" "yfinance>=0.2.50,<2" "requests>=2.31,<3"
      - name: Collect and settle ES futures PAPER
        run: python github_paper_worker.py
      - name: Commit public PAPER outcomes (no keys or logins)
        run: |
          git config user.name "CLAUDE PAPER research bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auto_futures/
          if ! git diff --cached --quiet; then
            git commit -m "paper: refresh public ES futures results [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes to PAPER research archive"
          fi
